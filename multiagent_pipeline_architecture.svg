<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" width="1400" height="820" style="background:#0b132b; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="agent1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c4a6e"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>

    <linearGradient id="agent2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>

    <linearGradient id="agent3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7f1d1d"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>

    <linearGradient id="agent4Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>

    <linearGradient id="agent5Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#581c87"/>
    </linearGradient>

    <linearGradient id="exchangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Filters for Glow & Shadows -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <filter id="redGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#ef4444" flood-opacity="0.6"/>
    </filter>

    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f87171"/>
    </marker>
  </defs>

  <!-- Background Decorative Grid Lines -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="100" x2="1400" y2="100"/>
    <line x1="0" y1="200" x2="1400" y2="200"/>
    <line x1="0" y1="300" x2="1400" y2="300"/>
    <line x1="0" y1="400" x2="1400" y2="400"/>
    <line x1="0" y1="500" x2="1400" y2="500"/>
    <line x1="0" y1="600" x2="1400" y2="600"/>
    <line x1="0" y1="700" x2="1400" y2="700"/>
    <line x1="200" y1="0" x2="200" y2="820"/>
    <line x1="400" y1="0" x2="400" y2="820"/>
    <line x1="600" y1="0" x2="600" y2="820"/>
    <line x1="800" y1="0" x2="800" y2="820"/>
    <line x1="1000" y1="0" x2="1000" y2="820"/>
    <line x1="1200" y1="0" x2="1200" y2="820"/>
  </g>

  <!-- ================= HEADER SECTION ================= -->
  <rect x="50" y="30" width="1300" height="90" rx="14" fill="url(#headerGrad)" stroke="#334155" stroke-width="1.5" filter="url(#dropShadow)"/>
  <rect x="75" y="48" width="170" height="24" rx="12" fill="#0369a1" opacity="0.3"/>
  <rect x="75" y="48" width="170" height="24" rx="12" fill="none" stroke="#38bdf8" stroke-width="1"/>
  <text x="160" y="64" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">INSTITUTIONAL PIPELINE</text>

  <text x="75" y="100" fill="#ffffff" font-size="22" font-weight="800" letter-spacing="-0.5">Delta Exchange Multi-Agent Trading Architecture</text>
  <text x="700" y="70" fill="#94a3b8" font-size="12" text-anchor="start">Inspired by <tspan fill="#38bdf8" font-weight="700">claude-trading-skills</tspan> &amp; Model Context Protocol (MCP)</text>
  <text x="700" y="94" fill="#64748b" font-size="11" text-anchor="start">Core Tenet: Strict Capital Preservation • 1% Account Risk • Zero Blind Orders • Mandatory 2:1 R:R</text>

  <!-- ================= AGENT 1: REGIME ANALYST ================= -->
  <g transform="translate(50, 160)" filter="url(#dropShadow)">
    <rect width="235" height="340" rx="12" fill="url(#agent1Grad)" stroke="#0284c7" stroke-width="2"/>
    <rect x="15" y="15" width="205" height="26" rx="6" fill="#0369a1"/>
    <text x="117" y="32" fill="#e0f2fe" font-size="11" font-weight="800" text-anchor="middle">AGENT 1 : THE SCOUT</text>
    <text x="117" y="62" fill="#ffffff" font-size="15" font-weight="800" text-anchor="middle">Regime Analyst</text>
    <text x="117" y="80" fill="#7dd3fc" font-size="10" text-anchor="middle">regime_analyst.py</text>
    <line x1="20" y1="95" x2="215" y2="95" stroke="#0369a1" stroke-width="1"/>

    <!-- Key Responsibilities -->
    <text x="20" y="120" fill="#bae6fd" font-size="11" font-weight="700">INPUT DATA:</text>
    <text x="20" y="138" fill="#e0f2fe" font-size="10">• 100 Candles (1H / 4H Res)</text>
    <text x="20" y="156" fill="#e0f2fe" font-size="10">• Level 2 Orderbook Depth</text>

    <text x="20" y="185" fill="#bae6fd" font-size="11" font-weight="700">MATH INDICATORS:</text>
    <text x="20" y="203" fill="#e0f2fe" font-size="10">• EMA 9, 21, 50, 200 Stack</text>
    <text x="20" y="221" fill="#e0f2fe" font-size="10">• RSI-14 (Wilder Momentum)</text>
    <text x="20" y="239" fill="#e0f2fe" font-size="10">• ATR-14 (Candle Volatility)</text>
    <text x="20" y="257" fill="#e0f2fe" font-size="10">• Pivot Support &amp; Resistance</text>

    <rect x="15" y="280" width="205" height="42" rx="8" fill="#082f49" stroke="#38bdf8" stroke-width="1"/>
    <text x="117" y="298" fill="#38bdf8" font-size="9" font-weight="700" text-anchor="middle">OUTPUT CLASSIFICATION</text>
    <text x="117" y="313" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">STRONG_BULLISH / BEARISH</text>
  </g>

  <!-- Connecting Arrow 1 -> 2 -->
  <line x1="285" y1="330" x2="315" y2="330" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="300" y="318" fill="#7dd3fc" font-size="9" font-weight="700" text-anchor="middle">Regime</text>

  <!-- ================= AGENT 2: STRATEGY GENERATOR ================= -->
  <g transform="translate(325, 160)" filter="url(#dropShadow)">
    <rect width="235" height="340" rx="12" fill="url(#agent2Grad)" stroke="#d97706" stroke-width="2"/>
    <rect x="15" y="15" width="205" height="26" rx="6" fill="#b45309"/>
    <text x="117" y="32" fill="#fef3c7" font-size="11" font-weight="800" text-anchor="middle">AGENT 2 : THE PLANNER</text>
    <text x="117" y="62" fill="#ffffff" font-size="15" font-weight="800" text-anchor="middle">Strategy Generator</text>
    <text x="117" y="80" fill="#fde68a" font-size="10" text-anchor="middle">strategy_agent.py</text>
    <line x1="20" y1="95" x2="215" y2="95" stroke="#b45309" stroke-width="1"/>

    <!-- Key Responsibilities -->
    <text x="20" y="120" fill="#fde68a" font-size="11" font-weight="700">CORE STRATEGIES:</text>
    <text x="20" y="138" fill="#fef3c7" font-size="10">• Trend Continuation Long</text>
    <text x="20" y="156" fill="#fef3c7" font-size="10">• Trend Continuation Short</text>
    <text x="20" y="174" fill="#fef3c7" font-size="10">• Support Mean-Reversion</text>

    <text x="20" y="205" fill="#fde68a" font-size="11" font-weight="700">BOUNDARIES SET:</text>
    <text x="20" y="223" fill="#fef3c7" font-size="10">• Entry Price</text>
    <text x="20" y="241" fill="#fef3c7" font-size="10">• Invalidation (Stop-Loss)</text>
    <text x="20" y="259" fill="#fef3c7" font-size="10">• Profit Target (Take-Profit)</text>

    <rect x="15" y="280" width="205" height="42" rx="8" fill="#451a03" stroke="#f59e0b" stroke-width="1"/>
    <text x="117" y="298" fill="#f59e0b" font-size="9" font-weight="700" text-anchor="middle">MANDATORY RULE</text>
    <text x="117" y="313" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">Min 2.0:1 Reward-to-Risk</text>
  </g>

  <!-- Connecting Arrow 2 -> 3 -->
  <line x1="560" y1="330" x2="590" y2="330" stroke="#f59e0b" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="575" y="318" fill="#fde68a" font-size="9" font-weight="700" text-anchor="middle">Setup</text>

  <!-- ================= AGENT 3: RISK GATEKEEPER ================= -->
  <g transform="translate(600, 145)" filter="url(#redGlow)">
    <rect width="255" height="370" rx="14" fill="url(#agent3Grad)" stroke="#ef4444" stroke-width="2.5"/>
    <rect x="15" y="15" width="225" height="28" rx="6" fill="#dc2626"/>
    <text x="127" y="33" fill="#fee2e2" font-size="11" font-weight="900" text-anchor="middle">AGENT 3 : THE RISK BOSS</text>
    <text x="127" y="66" fill="#ffffff" font-size="17" font-weight="900" text-anchor="middle">Risk Gatekeeper</text>
    <text x="127" y="84" fill="#fca5a5" font-size="10" text-anchor="middle">risk_gatekeeper.py (ABSOLUTE VETO)</text>
    <line x1="20" y1="98" x2="235" y2="98" stroke="#dc2626" stroke-width="1"/>

    <!-- Key Responsibilities -->
    <text x="20" y="123" fill="#fecaca" font-size="11" font-weight="800">SAFETY CHECKS (VETO GATES):</text>
    <text x="20" y="142" fill="#ffffff" font-size="10">1. Daily Drawdown &lt; 5.0%</text>
    <text x="20" y="160" fill="#ffffff" font-size="10">2. Active Open Positions &lt; 3</text>
    <text x="20" y="178" fill="#ffffff" font-size="10">3. Reward/Risk Ratio &gt;= 2.0:1</text>
    <text x="20" y="196" fill="#ffffff" font-size="10">4. Required Margin &lt;= Available</text>

    <text x="20" y="228" fill="#fecaca" font-size="11" font-weight="800">QUANTITATIVE SIZING:</text>
    <rect x="18" y="238" width="220" height="48" rx="6" fill="#450a0a" stroke="#f87171" stroke-width="1"/>
    <text x="127" y="255" fill="#fca5a5" font-size="8.5" text-anchor="middle">Max Dollar Loss = Equity x 1%</text>
    <text x="127" y="273" fill="#ffffff" font-size="10" font-weight="800" text-anchor="middle">Contracts = Risk / (SL Distance)</text>

    <rect x="15" y="300" width="225" height="50" rx="8" fill="#18181b" stroke="#ef4444" stroke-width="1.5"/>
    <text x="127" y="320" fill="#f87171" font-size="9" font-weight="800" text-anchor="middle">GATE DECISION VERDICT</text>
    <text x="127" y="338" fill="#22c55e" font-size="14" font-weight="900" text-anchor="middle">APPROVED / REJECTED</text>
  </g>

  <!-- VETO REJECTION PATH -->
  <path d="M 727 515 L 727 590 L 727 605" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="4,4" marker-end="url(#arrowRed)"/>
  <rect x="640" y="605" width="175" height="32" rx="6" fill="#7f1d1d" stroke="#ef4444" stroke-width="1.5"/>
  <text x="727" y="625" fill="#ffffff" font-size="10" font-weight="800" text-anchor="middle">❌ TRADE DROPPED</text>

  <!-- Connecting Arrow 3 -> 4 -->
  <line x1="855" y1="330" x2="890" y2="330" stroke="#34d399" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <text x="872" y="318" fill="#86efac" font-size="9" font-weight="700" text-anchor="middle">Approved</text>

  <!-- ================= AGENT 4: EXECUTION AGENT ================= -->
  <g transform="translate(900, 160)" filter="url(#dropShadow)">
    <rect width="215" height="340" rx="12" fill="url(#agent4Grad)" stroke="#10b981" stroke-width="2"/>
    <rect x="15" y="15" width="185" height="26" rx="6" fill="#047857"/>
    <text x="107" y="32" fill="#d1fae5" font-size="11" font-weight="800" text-anchor="middle">AGENT 4 : THE PILOT</text>
    <text x="107" y="62" fill="#ffffff" font-size="15" font-weight="800" text-anchor="middle">Execution Agent</text>
    <text x="107" y="80" fill="#a7f3d0" font-size="10" text-anchor="middle">execution_agent.py</text>
    <line x1="20" y1="95" x2="195" y2="95" stroke="#047857" stroke-width="1"/>

    <!-- Key Responsibilities -->
    <text x="20" y="120" fill="#a7f3d0" font-size="11" font-weight="700">EXECUTION PROTOCOL:</text>
    <text x="20" y="138" fill="#d1fae5" font-size="10">• Set Leverage &lt;= 10x</text>
    <text x="20" y="156" fill="#d1fae5" font-size="10">• HMAC-SHA256 Sign</text>
    <text x="20" y="174" fill="#d1fae5" font-size="10">• Submit Atomic Bracket</text>

    <text x="20" y="205" fill="#a7f3d0" font-size="11" font-weight="700">ATOMIC 3-IN-1 LEGS:</text>
    <text x="20" y="223" fill="#ffffff" font-size="10">1. Primary Entry Fill</text>
    <text x="20" y="241" fill="#ffffff" font-size="10">2. Protective Stop-Loss</text>
    <text x="20" y="259" fill="#ffffff" font-size="10">3. Take-Profit Target</text>

    <rect x="15" y="280" width="185" height="42" rx="8" fill="#022c22" stroke="#34d399" stroke-width="1"/>
    <text x="107" y="298" fill="#34d399" font-size="9" font-weight="700" text-anchor="middle">SAFETY GUARANTEE</text>
    <text x="107" y="313" fill="#ffffff" font-size="10" font-weight="800" text-anchor="middle">Never Unprotected</text>
  </g>

  <!-- Connecting Arrow 4 -> 5 -->
  <line x1="1115" y1="330" x2="1145" y2="330" stroke="#c084fc" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="1130" y="318" fill="#e9d5ff" font-size="9" font-weight="700" text-anchor="middle">Filled</text>

  <!-- ================= AGENT 5: PORTFOLIO MONITOR ================= -->
  <g transform="translate(1155, 160)" filter="url(#dropShadow)">
    <rect width="200" height="340" rx="12" fill="url(#agent5Grad)" stroke="#a855f7" stroke-width="2"/>
    <rect x="15" y="15" width="170" height="26" rx="6" fill="#7e22ce"/>
    <text x="100" y="32" fill="#f3e8ff" font-size="11" font-weight="800" text-anchor="middle">AGENT 5 : ACCOUNTANT</text>
    <text x="100" y="62" fill="#ffffff" font-size="14" font-weight="800" text-anchor="middle">Portfolio Monitor</text>
    <text x="100" y="80" fill="#e9d5ff" font-size="10" text-anchor="middle">portfolio_monitor.py</text>
    <line x1="20" y1="95" x2="180" y2="95" stroke="#7e22ce" stroke-width="1"/>

    <!-- Key Responsibilities -->
    <text x="20" y="120" fill="#e9d5ff" font-size="11" font-weight="700">LIFECYCLE CONTROL:</text>
    <text x="20" y="138" fill="#f3e8ff" font-size="10">• Real-Time Mark PnL</text>
    <text x="20" y="156" fill="#f3e8ff" font-size="10">• Liquidation Distance</text>
    <text x="20" y="174" fill="#f3e8ff" font-size="10">• Trailing Stop Logic</text>

    <text x="20" y="205" fill="#e9d5ff" font-size="11" font-weight="700">MEMORY &amp; JOURNAL:</text>
    <text x="20" y="223" fill="#f3e8ff" font-size="10">• trade_journal.json</text>
    <text x="20" y="241" fill="#f3e8ff" font-size="10">• Daily Digest Reports</text>

    <rect x="15" y="280" width="170" height="42" rx="8" fill="#2e1065" stroke="#c084fc" stroke-width="1"/>
    <text x="100" y="298" fill="#c084fc" font-size="9" font-weight="700" text-anchor="middle">BREAKEVEN PROTOCOL</text>
    <text x="100" y="313" fill="#ffffff" font-size="10" font-weight="800" text-anchor="middle">Zero Downside Risk</text>
  </g>

  <!-- ================= DELTA EXCHANGE CLOUD MATCHING ENGINE ================= -->
  <g transform="translate(50, 660)" filter="url(#dropShadow)">
    <rect width="1300" height="110" rx="14" fill="url(#exchangeGrad)" stroke="#4338ca" stroke-width="2"/>
    <rect x="25" y="20" width="220" height="30" rx="8" fill="#312e81"/>
    <text x="135" y="40" fill="#a5b4fc" font-size="11" font-weight="800" text-anchor="middle">DELTA EXCHANGE ENGINE</text>

    <text x="25" y="75" fill="#ffffff" font-size="14" font-weight="800">Matching Engine, Liquidity Pools &amp; Real-Time Clearing</text>
    <text x="25" y="95" fill="#94a3b8" font-size="11">Perpetual Futures Contracts (BTC, ETH, SOL, XRP) • Margin Accounts • Real-time Mark Price Index</text>

    <!-- Badges on right -->
    <rect x="940" y="25" width="330" height="60" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
    <text x="960" y="47" fill="#a5b4fc" font-size="10" font-weight="700">Endpoints Connected:</text>
    <text x="960" y="65" fill="#cbd5e1" font-size="9.5">• api.india.delta.exchange (Live FIU Compliant)</text>
    <text x="960" y="78" fill="#cbd5e1" font-size="9.5">• cdn-ind.testnet.deltaex.org (Risk-Free Paper Demo)</text>
  </g>

  <!-- Bi-directional arrows to Delta Exchange -->
  <!-- Analyst feeds from Exchange -->
  <path d="M 167 660 L 167 500" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
  <text x="175" y="580" fill="#7dd3fc" font-size="8.5" font-weight="700">1. Candles History</text>

  <!-- Execution sends to Exchange -->
  <path d="M 1007 500 L 1007 660" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <text x="1015" y="580" fill="#86efac" font-size="8.5" font-weight="800">2. Signed Bracket Order</text>

  <!-- Monitor polls from Exchange -->
  <path d="M 1255 660 L 1255 500" stroke="#c084fc" stroke-width="2" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
  <text x="1262" y="580" fill="#e9d5ff" font-size="8.5" font-weight="700">3. Live Fills &amp; Mark</text>

  <!-- Footer Watermark -->
  <text x="700" y="805" fill="#475569" font-size="9.5" text-anchor="middle">Delta Exchange Multi-Agent Trading System Architecture • Generated October 2026</text>
</svg>

