<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1150" width="100%" height="100%" style="background:#0d1117;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="cardBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#60a5fa" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10b981" />
    </marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f59e0b" />
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="1600" height="1150" fill="url(#bgGradient)"/>

  <!-- Top Title Banner -->
  <rect x="50" y="30" width="1500" height="80" rx="16" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="80" y="72" fill="#ffffff" font-size="24" font-weight="bold">🚀 DELTA EXCHANGE MULTI-AGENT 24/7 TRADING ARCHITECTURE</text>
  <text x="80" y="94" fill="#8b949e" font-size="13">Institutional 5-Timeframe Confluence Engine · 2-Way Telegram Confirmation Gate · Dynamic Trailing Stop Loss</text>
  <rect x="1300" y="50" width="220" height="40" rx="8" fill="#238636"/>
  <text x="1335" y="75" fill="#ffffff" font-size="14" font-weight="bold">● CLOUD ACTIVE (Render)</text>

  <!-- ================= SECTION 1: CLOUD RUNTIME &amp; HEALTH ================= -->
  <rect x="50" y="130" width="460" height="300" rx="14" fill="#161b22" stroke="#388bfd" stroke-width="1.5"/>
  <rect x="50" y="130" width="460" height="40" rx="14" fill="#1f2937"/>
  <text x="75" y="156" fill="#58a6ff" font-size="16" font-weight="bold">☁️ LAYER 1: 24/7 CLOUD ENVIRONMENT (Render)</text>
  
  <rect x="70" y="185" width="420" height="65" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="90" y="210" fill="#e6edf3" font-size="14" font-weight="bold">UptimeRobot Automated Keep-Alive</text>
  <text x="90" y="232" fill="#8b949e" font-size="12">Pings HEAD/GET https://.../health every 5 min (Zero Sleep)</text>

  <rect x="70" y="260" width="420" height="65" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="90" y="285" fill="#e6edf3" font-size="14" font-weight="bold">Multi-Threaded Server Loop (server.py)</text>
  <text x="90" y="307" fill="#8b949e" font-size="12">Thread 1: HTTP Health Responder | Thread 2: Scanner Cadence</text>

  <rect x="70" y="335" width="420" height="80" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="90" y="360" fill="#f59e0b" font-size="14" font-weight="bold">⚡ Real-Time Trailing Stop Tick (Every 15s)</text>
  <text x="90" y="382" fill="#8b949e" font-size="12">Continuously polls open orders to move stops to BE at 1:1,</text>
  <text x="90" y="400" fill="#8b949e" font-size="12">lock profit at 1:2, and extend runners to 1:3 &amp; 1:5.</text>

  <!-- ================= SECTION 2: 5-AGENT DECISION ENGINE ================= -->
  <rect x="540" y="130" width="520" height="570" rx="14" fill="#161b22" stroke="#8957e5" stroke-width="1.5"/>
  <rect x="540" y="130" width="520" height="40" rx="14" fill="#2e1065"/>
  <text x="565" y="156" fill="#d8b4fe" font-size="16" font-weight="bold">🧠 LAYER 2: 5-AGENT ORCHESTRATION PIPELINE</text>

  <!-- Agent 5 -->
  <rect x="560" y="185" width="480" height="65" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="580" y="210" fill="#38bdf8" font-size="13" font-weight="bold">Agent 5: Portfolio Monitor &amp; Guard</text>
  <text x="580" y="232" fill="#8b949e" font-size="12">Inspects wallet balances, active contracts, and calculates unrealized PnL.</text>

  <!-- Agent 1 -->
  <rect x="560" y="260" width="480" height="125" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="580" y="285" fill="#38bdf8" font-size="13" font-weight="bold">Agent 1: Regime Analyst (5-Timeframe Confluence Engine)</text>
  <text x="580" y="307" fill="#10b981" font-size="11" font-weight="bold">• 1M Monthly:</text><text x="670" y="307" fill="#8b949e" font-size="11">Ultra-Macro Trend vs Monthly Open &amp; PMH/PML</text>
  <text x="580" y="325" fill="#10b981" font-size="11" font-weight="bold">• 1W Weekly:</text><text x="670" y="325" fill="#8b949e" font-size="11">Weekly EMA 21 Stack, Weekly RSI &amp; PWH/PWL</text>
  <text x="580" y="343" fill="#10b981" font-size="11" font-weight="bold">• 1D Daily:</text><text x="670" y="343" fill="#8b949e" font-size="11">Daily EMA 21/50/200 Trend &amp; PDH/PDL Sweep Filter</text>
  <text x="580" y="361" fill="#10b981" font-size="11" font-weight="bold">• 4H &amp; 1H:</text><text x="670" y="361" fill="#8b949e" font-size="11">Cycle Momentum + Fractal Liquidity Sweep (BSL/SSL) + MSS</text>

  <!-- Agent 2 -->
  <rect x="560" y="395" width="480" height="85" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="580" y="420" fill="#38bdf8" font-size="13" font-weight="bold">Agent 2: Strategy Agent (Institutional Edge &amp; Scoring)</text>
  <text x="580" y="440" fill="#8b949e" font-size="12">Calculates Institutional Confluence Score (0-100). Requires score ≥ 70.</text>
  <text x="580" y="460" fill="#8b949e" font-size="12">Anchors Structural Stop Loss at sweep wick extreme + ATR buffer.</text>

  <!-- Agent 3 -->
  <rect x="560" y="490" width="480" height="95" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="580" y="515" fill="#38bdf8" font-size="13" font-weight="bold">Agent 3: Risk Gatekeeper (Discipline &amp; Sizing Engine)</text>
  <text x="580" y="535" fill="#8b949e" font-size="12">• Sizing: Dynamically allocates 75% to 100% of available capital</text>
  <text x="580" y="553" fill="#8b949e" font-size="12">• Leverage: 50x Isolated on BTC | 25x Isolated on SOL, XAU &amp; Alts</text>
  <text x="580" y="571" fill="#8b949e" font-size="12">• Discipline Gate: Validates Reward-to-Risk ratio ≥ 2.0:1</text>

  <!-- Agent 4 -->
  <rect x="560" y="595" width="480" height="85" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="580" y="620" fill="#38bdf8" font-size="13" font-weight="bold">Agent 4: Execution Agent</text>
  <text x="580" y="640" fill="#8b949e" font-size="12">Gated by Telegram Confirmation. Only triggers when button is tapped.</text>
  <text x="580" y="660" fill="#8b949e" font-size="12">Submits Native Delta Bracket Orders (Limit + Protective SL + TP).</text>

  <!-- ================= SECTION 3: 2-WAY TELEGRAM CONFIRMATION GATE ================= -->
  <rect x="1090" y="130" width="460" height="570" rx="14" fill="#161b22" stroke="#238636" stroke-width="1.5"/>
  <rect x="1090" y="130" width="460" height="40" rx="14" fill="#064e3b"/>
  <text x="1115" y="156" fill="#6ee7b7" font-size="16" font-weight="bold">📱 LAYER 3: 2-WAY TELEGRAM CONFIRMATION</text>

  <rect x="1110" y="185" width="420" height="180" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="1130" y="210" fill="#f59e0b" font-size="13" font-weight="bold">Push Proposal Alert with Full Reasoning:</text>
  <text x="1130" y="230" fill="#8b949e" font-size="11">• Asset &amp; Direction: e.g. BTCUSD 🔴 SHORT / SOLUSD 🟢 LONG</text>
  <text x="1130" y="248" fill="#8b949e" font-size="11">• 5-Timeframe Matrix: Monthly, Weekly, Daily, 4H, 1H</text>
  <text x="1130" y="266" fill="#8b949e" font-size="11">• Key Levels: Entry Price · Stop Loss · Target 1 (1:2 R:R)</text>
  <text x="1130" y="284" fill="#8b949e" font-size="11">• Trailing Plan: 1:1 → BE · 1:2 → Lock +1R · 1:3 → Lock +2R</text>
  <text x="1130" y="302" fill="#8b949e" font-size="11">• Size: Contracts, Margin (~$XX), Isolated Leverage (50x/25x)</text>
  <text x="1130" y="322" fill="#f87171" font-size="11" font-weight="bold">⚠️ ZERO ORDERS SENT WITHOUT YOUR EXPLICIT BUTTON TAP</text>

  <!-- Interactive Buttons Graphic -->
  <rect x="1125" y="375" width="185" height="42" rx="6" fill="#10b981" stroke="#34d399" stroke-width="1.5"/>
  <text x="1145" y="402" fill="#ffffff" font-size="13" font-weight="bold">✅ Confirm &amp; Execute</text>

  <rect x="1325" y="375" width="185" height="42" rx="6" fill="#dc2626" stroke="#f87171" stroke-width="1.5"/>
  <text x="1365" y="402" fill="#ffffff" font-size="13" font-weight="bold">❌ Reject Trade</text>

  <!-- Branching Outcomes -->
  <rect x="1110" y="435" width="420" height="115" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="1130" y="460" fill="#e6edf3" font-size="13" font-weight="bold">Gate Decision Logic (10 Min Timeout):</text>
  <text x="1130" y="482" fill="#10b981" font-size="11" font-weight="bold">[Confirm Clicked]:</text>
  <text x="1245" y="482" fill="#8b949e" font-size="11">Order executed on Delta · Fill receipt sent</text>
  <text x="1130" y="505" fill="#ef4444" font-size="11" font-weight="bold">[Reject Clicked]:</text>
  <text x="1245" y="505" fill="#8b949e" font-size="11">Trade cancelled · Message updated · 0 Risk</text>
  <text x="1130" y="528" fill="#9ca3af" font-size="11" font-weight="bold">[No Response]:</text>
  <text x="1245" y="528" fill="#8b949e" font-size="11">Times out after 10m · No trade placed</text>

  <rect x="1110" y="565" width="420" height="115" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="1130" y="590" fill="#38bdf8" font-size="13" font-weight="bold">Telegram In-Chat Management:</text>
  <text x="1130" y="612" fill="#8b949e" font-size="11">• /status - Live cycle count, balance &amp; active positions</text>
  <text x="1130" y="632" fill="#8b949e" font-size="11">• /positions - Live mark prices, trailing stages &amp; PnL</text>
  <text x="1130" y="652" fill="#8b949e" font-size="11">• Trailing Alerts: Pushed on every stop modification</text>

  <!-- ================= SECTION 4: DELTA EXCHANGE &amp; EXECUTION ================= -->
  <rect x="50" y="730" width="720" height="380" rx="14" fill="#161b22" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="50" y="730" width="720" height="40" rx="14" fill="#78350f"/>
  <text x="75" y="756" fill="#fde68a" font-size="16" font-weight="bold">⚡ LAYER 4: DELTA EXCHANGE API INTEGRATION &amp; BRACKETS</text>

  <!-- Endpoints and capabilities -->
  <rect x="70" y="785" width="680" height="95" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="90" y="810" fill="#f59e0b" font-size="13" font-weight="bold">Native HMAC-SHA256 Signed Client (src/delta_client.py)</text>
  <text x="90" y="830" fill="#8b949e" font-size="12">• Authenticated via HMAC-SHA256 signature (Timestamp + Method + Path + Body)</text>
  <text x="90" y="848" fill="#8b949e" font-size="12">• Endpoints: POST /v2/orders (Brackets), PUT /v2/orders (Edit SL/TP), GET /v2/positions/margined</text>
  <text x="90" y="866" fill="#8b949e" font-size="12">• Automatic symbol resolution: XAUUSD → XAUTUSD (Gold), BTCUSD, SOLUSD, XRP, DOGE, ADA</text>

  <rect x="70" y="890" width="680" height="200" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="90" y="915" fill="#10b981" font-size="13" font-weight="bold">Bracket Order Execution Architecture:</text>
  
  <rect x="90" y="930" width="190" height="55" rx="6" fill="#1f2937" stroke="#38bdf8"/>
  <text x="105" y="952" fill="#38bdf8" font-size="12" font-weight="bold">Primary Order</text>
  <text x="105" y="972" fill="#e6edf3" font-size="11">Limit Entry @ Optimal</text>

  <rect x="315" y="930" width="190" height="55" rx="6" fill="#1f2937" stroke="#ef4444"/>
  <text x="330" y="952" fill="#ef4444" font-size="12" font-weight="bold">Protective Stop-Loss</text>
  <text x="330" y="972" fill="#e6edf3" font-size="11">Sweep Wick + 0.15 ATR</text>

  <rect x="540" y="930" width="190" height="55" rx="6" fill="#1f2937" stroke="#10b981"/>
  <text x="555" y="952" fill="#10b981" font-size="12" font-weight="bold">Initial Take-Profit</text>
  <text x="555" y="972" fill="#e6edf3" font-size="11">Exact 1:2 R:R Target</text>

  <text x="90" y="1015" fill="#8b949e" font-size="12">• All 3 orders are linked on-exchange with reduce_only=True and stop_trigger_method=mark_price.</text>
  <text x="90" y="1035" fill="#8b949e" font-size="12">• If Entry fills, SL and TP become active immediately on the Delta orderbook.</text>
  <text x="90" y="1055" fill="#8b949e" font-size="12">• If SL triggers, TP is automatically cancelled (OCO bracket protection).</text>
  <text x="90" y="1075" fill="#10b981" font-size="12" font-weight="bold">✅ Capital is guaranteed protected even if cloud connection drops.</text>

  <!-- ================= SECTION 5: REAL-TIME TRAILING STOP LOSS ================= -->
  <rect x="800" y="730" width="750" height="380" rx="14" fill="#161b22" stroke="#10b981" stroke-width="1.5"/>
  <rect x="800" y="730" width="750" height="40" rx="14" fill="#064e3b"/>
  <text x="825" y="756" fill="#a7f3d0" font-size="16" font-weight="bold">🛡️ LAYER 5: DYNAMIC TRAILING STOP LOSS &amp; PROFIT PRESERVATION</text>

  <rect x="820" y="785" width="710" height="80" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="840" y="810" fill="#38bdf8" font-size="13" font-weight="bold">R-Multiple Calculation Engine (src/trailing_stop_manager.py)</text>
  <text x="840" y="830" fill="#8b949e" font-size="12">• R = (Current Mark Price - Entry Price) / |Entry Price - Initial Stop Loss|</text>
  <text x="840" y="850" fill="#8b949e" font-size="12">• Continuous loop runs every 15s to modify Delta order via PUT /v2/orders instantly.</text>

  <!-- 4 Trailing Stages -->
  <rect x="820" y="875" width="165" height="120" rx="8" fill="#1f2937" stroke="#10b981" stroke-width="1.5"/>
  <text x="835" y="900" fill="#10b981" font-size="13" font-weight="bold">Stage 1: Breakeven</text>
  <text x="835" y="920" fill="#e6edf3" font-size="12" font-weight="bold">Profit ≥ +1.0R</text>
  <text x="835" y="940" fill="#8b949e" font-size="11">SL → Entry + Buffer</text>
  <text x="835" y="960" fill="#8b949e" font-size="11">Risk = ZERO (Free Roll)</text>
  <text x="835" y="980" fill="#10b981" font-size="11">Telegram alert sent</text>

  <rect x="1000" y="875" width="165" height="120" rx="8" fill="#1f2937" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="1015" y="900" fill="#f59e0b" font-size="13" font-weight="bold">Stage 2: Lock +1R</text>
  <text x="1015" y="920" fill="#e6edf3" font-size="12" font-weight="bold">Profit ≥ +2.0R</text>
  <text x="1015" y="940" fill="#8b949e" font-size="11">SL → Entry + 1.0R</text>
  <text x="1015" y="960" fill="#8b949e" font-size="11">TP extended to 1:3</text>
  <text x="1015" y="980" fill="#f59e0b" font-size="11">Pure profit banked</text>

  <rect x="1180" y="875" width="165" height="120" rx="8" fill="#1f2937" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="1195" y="900" fill="#8b5cf6" font-size="13" font-weight="bold">Stage 3: Lock +2R</text>
  <text x="1195" y="920" fill="#e6edf3" font-size="12" font-weight="bold">Profit ≥ +3.0R</text>
  <text x="1195" y="940" fill="#8b949e" font-size="11">SL → Entry + 2.0R</text>
  <text x="1195" y="960" fill="#8b949e" font-size="11">TP extended to 1:5</text>
  <text x="1195" y="980" fill="#8b5cf6" font-size="11">Captures runners</text>

  <rect x="1360" y="875" width="170" height="120" rx="8" fill="#1f2937" stroke="#ec4899" stroke-width="1.5"/>
  <text x="1375" y="900" fill="#ec4899" font-size="13" font-weight="bold">Stage 4: Runner</text>
  <text x="1375" y="920" fill="#e6edf3" font-size="12" font-weight="bold">Profit ≥ +5.0R</text>
  <text x="1375" y="940" fill="#8b949e" font-size="11">SL → Entry + 4.0R</text>
  <text x="1375" y="960" fill="#8b949e" font-size="11">Maximizes profit</text>
  <text x="1375" y="980" fill="#ec4899" font-size="11">Exponential gains</text>

  <rect x="820" y="1005" width="710" height="85" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="840" y="1030" fill="#10b981" font-size="12" font-weight="bold">Verified Live Execution Example (Current Active Trades):</text>
  <text x="840" y="1050" fill="#8b949e" font-size="11">• ETHUSD Long: Reached +1.34R → SL automatically edited to $2,232.24 (Breakeven + fee buffer)</text>
  <text x="840" y="1070" fill="#8b949e" font-size="11">• BTCUSD Short: Entered at $77,931 with $78,174.66 SL and $77,443.68 TP (Initial 1:2 R:R)</text>

  <!-- Connective Arrows -->
  <!-- Layer 1 to Layer 2 -->
  <path d="M 510 280 L 535 280" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Layer 2 to Layer 3 -->
  <path d="M 1060 280 L 1085 280" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Layer 3 to Layer 4 (Execution) -->
  <path d="M 1215 420 L 1215 710 L 410 710 L 410 725" stroke="#10b981" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#arrowGreen)"/>
  <!-- Layer 4 to Layer 5 (Trailing Stop Registration) -->
  <path d="M 770 920 L 795 920" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrowGold)"/>

</svg>